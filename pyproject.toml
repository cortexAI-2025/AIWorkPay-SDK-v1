[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aiworkpay"
version = "2.0.0"
description = "AIWorkPay SDK: order missions from human Payworkers for your AI agent, follow them, pay for them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AIWorkPay" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1"]
keywords = ["aiworkpay", "ai-agents", "human-in-the-loop", "payworker", "mcp", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/cortexAI-2025/AIWorkPay-SDK-v1"
Source = "https://github.com/cortexAI-2025/AIWorkPay-SDK-v1"
Issues = "https://github.com/cortexAI-2025/AIWorkPay-SDK-v1/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff", "mypy>=1.10"]

[tool.setuptools]
packages = ["aiworkpay"]

[tool.setuptools.package-data]
aiworkpay = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs a running AIWorkPay (AIWORKPAY_TEST_BASE_URL, AIWORKPAY_TEST_API_KEY)", "e2e: needs the isolated environment of Aiworkpay-v2 (E2E_CONTROL_URL)"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["aiworkpay"]
