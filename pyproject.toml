[project]
name = "aiworkpay"
version = "1.0.0"
description = "AIWorkPay SDK - Human task delegation for AI agents"
authors = [{name = "AIWorkPay"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py39"
